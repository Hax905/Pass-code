name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database integration (docker-compose MongoDB)
    runs-on: ubuntu-latest
    env:
      MONGO_ROOT_USERNAME: passcode
      MONGO_ROOT_PASSWORD: passcode-ci-only
      DATABASE_URL: mongodb://passcode:passcode-ci-only@127.0.0.1:27017/?authSource=admin&directConnection=true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Start MongoDB from docker-compose.yml
        run: docker compose up -d --wait --wait-timeout 180
      - run: npm ci
      - run: npm run db:sync
      - run: npm run test:integration
      - name: MongoDB logs on failure
        if: failure()
        run: docker compose logs mongo

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      MONGO_ROOT_USERNAME: passcode
      MONGO_ROOT_PASSWORD: passcode-ci-only
      DATABASE_URL: mongodb://passcode:passcode-ci-only@127.0.0.1:27017/?authSource=admin&directConnection=true
      AUTH_URL: http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Start MongoDB from docker-compose.yml
        run: docker compose up -d --wait --wait-timeout 180
      - run: npm ci
      - name: Generate the secrets the app needs
        run: |
          echo "PASSCODE_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -base64 33)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
