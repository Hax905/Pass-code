# Optional local MongoDB for development, as an alternative to MongoDB Atlas.
# Values come from .env (see .env.example).
# - Authentication is ON (MongoDB's own default is off).
# - Runs as a single-node replica set, because PassCode uses multi-document
#   transactions; a replica set with auth requires an internal keyfile.
# - Bound to 127.0.0.1 only — the database is never exposed to the network.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-passcode}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -f /data/db/keyfile ]; then
          openssl rand -base64 756 > /data/db/keyfile
        fi
        chmod 400 /data/db/keyfile && chown 999:999 /data/db/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/db/keyfile
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - passcode-mongodata:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once it is primary.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  passcode-mongodata:
